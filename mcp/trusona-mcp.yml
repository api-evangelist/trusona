note: 'Trusona publishes NO MCP server. Searched the docs (www.trusona.com/integrations,
  www.trusona.com/atop-agent), the GitHub org (25 repos, none MCP), and npm for a
  @trusona/mcp package on 2026-09-01 — nothing. The provider DOES ship a first-party
  agent surface, but it is a Claude/Agent SKILL of bash scripts
  (https://github.com/trusona/atop-agent-skill, Apache-2.0), which is a different
  product from an MCP server: an agent invokes it by running shell scripts locally,
  not by speaking MCP to an endpoint. The tools[] below are DERIVED candidates from the
  OpenAPI operations, published here only as a design starting point. Because no server
  exists, NO MCPServer pointer is wired into apis.yml — the pointer would assert an
  agent surface Trusona does not serve.'
