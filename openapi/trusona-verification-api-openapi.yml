                gpsLongitude: null
                via: []
                offsetMinutes: 420
                epochMilliseconds: 1778000000000
                asn: null
                dateTime: 5/5/2026 09:53
                browserTimeZoneWithOffset: America/Los Angeles (-7)
                scanCode: "123"
                linkCode: "1920"
                scannedDocument: true
                blacklistedNetwork: false
                whitelistedNetwork: false
                truPassUsed: false
                fingerprint: abc123def456ghi789jkl012mno345pqr678stu9
                turnstileRobot: null
                turnstileError: null
        "404":
          description: Verification not found
  /api/v1/encrypted/verifications/{verificationId}:
    get:
      tags:
      - Encrypted Verifications
      summary: Get an encrypted verification by ID
      operationId: getEncryptedVerification
      parameters:
      - name: verificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Verification retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EncryptedVerificationResponse"
        "401":
          description: Unauthorized
        "404":
          description: Verification not found
  /api/v1/encrypted/verifications/{verificationId}/document:
    get:
      tags:
      - Encrypted Verifications
      summary: Get an encrypted document by verification ID
      description: Get the verification's document and return it encrypted with the
        same public key provided when the verification was created.
      operationId: getEncryptedDocument
      parameters:
      - name: verificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Encrypted document retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EncryptedDocumentResponse"
        "401":
          description: Unauthorized
        "404":
          description: Verification not found or document is not yet available
        "410":
          description: Document has been removed (occurs when parent verification
            expires)
components:
  schemas:
    CreateVerificationDto:
      type: object
      properties:
        documentType:
          type: string
          enum:
          - US_CA_DL
          - UK_DL
          - PASSPORT
          - INDIA_DL
          - INDIA_ID
          - INDIA_PAN
          - PHILIPPINES_DL
          - PHILIPPINES_ID
          - PHILIPPINES_MULTI_ID
          - US_MILITARY_ID
          - US_VETERAN_ID
          - SINGAPORE_DL
          - SINGAPORE_ID
          - SINGAPORE_WORK_PERMIT
          - SINGAPORE_EMPLOYMENT_PASS
          - PAKISTAN_ID
          - AUSTRALIA_DL
          - MEXICO_DL
          - NETHERLANDS_DL
          - US_PERMANENT_RESIDENT_CARD
          - GERMANY_ID
          - GERMANY_DL
          - GERMANY_RESIDENCE_PERMIT
          - AUSTRIA_ID
          - AUSTRIA_DL
          - AUSTRIA_RESIDENCE_PERMIT
          example: US_CA_DL
        callbackUrl:
          type:
          - string
          - "null"
          format: uri
          example: https://example.com/callback/unique/to/this/request/8b62142a99ba759d8c9153b68765513c62180891
        requestedVerifiers:
          type: array
          description: Set of verifiers to run against this verification. Each entry
            uses the 'verifier' discriminator field.
          example:
          - verifier: DMV
          - verifier: MNO_V
            phoneNumber: "+12025551234"
          items:
            oneOf:
            - $ref: "#/components/schemas/RequestedVerifier"
            - $ref: "#/components/schemas/RequestedDmvVerifier"
            - $ref: "#/components/schemas/RequestedLexisNexisVerifier"
            - $ref: "#/components/schemas/RequestedMnoVerifier"
          uniqueItems: true
        subject:
          type: "null"
          $ref: "#/components/schemas/VerificationSubject"
          description: "Optional identity information about the subject of this verification,\
            \ used by the ExpectedSubjectVerifier to compare against the scanned document."
        requestedMessages:
          type: array
          description: Set of messages to send for this verification. Each entry uses
            the 'channel' discriminator field. Maximum 2.
          example:
          - channel: SMS
            phoneNumber: "+12025551234"
          - channel: EMAIL
            emailAddress: user@example.com
          items:
            oneOf:
            - $ref: "#/components/schemas/RequestedMessage"
            - $ref: "#/components/schemas/RequestedCopyMessage"
            - $ref: "#/components/schemas/RequestedEmailMessage"
            - $ref: "#/components/schemas/RequestedSmsMessage"
            - $ref: "#/components/schemas/RequestedTrustedSmsMessage"
          maxItems: 2
          minItems: 0
          uniqueItems: true
        status:
          type:
          - string
          - "null"
          enum:
          - CREATED
      required:
      - documentType
    RequestedCopyMessage:
      allOf:
      - $ref: "#/components/schemas/RequestedMessage"
      required:
      - channel
    RequestedDmvVerifier:
      allOf:
      - $ref: "#/components/schemas/RequestedVerifier"
      description: Request a DMV (AAMVA) verification.
      required:
      - verifier
    RequestedEmailMessage:
      allOf:
      - $ref: "#/components/schemas/RequestedMessage"
      - type: object
        properties:
          emailAddress:
            type: string
            format: email
            description: Email address to send the message to.
            example: user@example.com
            minLength: 1
      description: Send an email message to the provided email address.
      required:
      - channel
      - emailAddress
    RequestedLexisNexisVerifier:
      allOf:
      - $ref: "#/components/schemas/RequestedVerifier"
      description: Request a LexisNexis verification.
      required:
      - verifier
    RequestedMessage:
      type: object
      discriminator:
        propertyName: channel
      properties:
        channel:
          type: string
          enum:
          - COPY
          - SMS
          - EMAIL
          - TRUSTED_SMS
      required:
      - channel
    RequestedMnoVerifier:
      allOf:
      - $ref: "#/components/schemas/RequestedVerifier"
      - type: object
        properties:
          phoneNumber:
            type: string
            description: "Phone number for MNO verification. Must be in one of the\
              \ countries the tenant has enabled for MNO, which default to the USA\
              \ (+1), Canada (+1) and the UK (+44). Dashes, spaces, dots and parentheses\
              \ are accepted; a missing country code is resolved against the default\
              \ countries, so numbers from any other enabled country must be given\
              \ in E.164 form."
            example: "+12025551234"
      description: Request an MNO (mobile network operator) verification.
      required:
      - verifier
    RequestedSmsMessage:
      allOf:
      - $ref: "#/components/schemas/RequestedMessage"
      - type: object
        properties:
          phoneNumber:
            type: string
            description: "Phone number to send the SMS to. Dashes, spaces, dots and\
              \ parentheses are accepted, as is a missing leading +; the number is\
              \ stored and returned in E.164 form. A number sent without a country\
              \ code cannot be resolved and is rejected."
            example: "+12025551234"
      description: Send an SMS message to the provided phone number.
      required:
      - channel
    RequestedTrustedSmsMessage:
      allOf:
      - $ref: "#/components/schemas/RequestedMessage"
      - type: object
        properties:
          phoneNumber:
            type: string
            description: "Phone number to send the trusted SMS to. Dashes, spaces,\
              \ dots and parentheses are accepted, as is a missing leading +; the\
              \ number is stored and returned in E.164 form. A number sent without\
              \ a country code cannot be resolved and is rejected."
            example: "+12025551234"
      description: Send a trusted SMS with SIM swap detection to the provided phone
        number.
      required:
      - channel
    RequestedVerifier:
      type: object
      discriminator:
        propertyName: verifier
      properties:
        verifier:
          type: string
          enum:
          - DMV
          - MNO_V
          - SCAN
      required:
      - verifier
    VerificationSubject:
      type: object
      description: Subject identity information supplied by the API consumer for matching
        against the scanned document.
      properties:
        firstName:
          type: string
          description: Expected first name.
          example: Susan
          maxLength: 128
          minLength: 0
        lastName:
          type: string
          description: Expected last name.
          example: O'Brien
          maxLength: 128
          minLength: 0
        dateOfBirth:
          type: string
          description: Expected date of birth in MM/DD/YYYY format.
          example: 03/14/1990
        city:
          type: string
          description: Expected city.
          example: San Francisco
          maxLength: 32
          minLength: 0
        state:
          type: string
          description: "Expected state, province or region."
          example: CA
          maxLength: 32
          minLength: 0
        country:
          type: string
          description: Expected country as ISO 3166-1 alpha-2.
          example: US
          pattern: "^[A-Za-z]{2}$"
    Matches:
      type: object
      additionalProperties: true
      description: "Verifier match results. The shape depends on the verifier type:\
        \ DMV matches include fields like firstName, lastName, dateOfBirth, documentNumber,\
        \ etc. MNO matches include fields like firstName, lastName, dateOfBirth, phoneNumber,\
        \ address1, etc. Each field is a boolean indicating whether the value matched\
        \ the verifier's records. A null value means the field was not available or\
        \ was not evaluated."
      example:
        lastName: true
        firstName: true
        dateOfBirth: true
        documentNumber: true
        address1: true
        address2: null
    RiskScore:
      type: object
      properties:
        ruleType:
          type: string
          enum:
          - SCAN
          - DEVICE
          - VERIFIER
        id:
          type: string
          format: uuid
          example: d2392d83-8410-41a7-adcf-a792acde7fb9
          readOnly: true
        score:
          type: string
          enum:
          - "NO"
          - LOW
          - HIGH
          example: "NO"
          readOnly: true
        rule:
          type: string
          readOnly: true
        reason:
          type: string
          readOnly: true
        type:
          type: string
          enum:
          - SCAN
          - DEVICE
          - VERIFIER
        riskyFields:
          type: array
          items:
            type: string
        verifier:
          type:
          - string
          - "null"
          enum:
          - DMV
          - NONE
          - MNO_V
          - SCAN
          - LEXIS
          - PASSKEY
          - ESV
        riskyDevices:
          type: array
          items:
            type: string
            format: uuid
        robotRule:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          example: 2022-01-01T00:00:00Z
          readOnly: true
        defaultScore:
          type: string
          description: The original risk score before any rule overrides were applied
          enum:
          - NONE
          - "NO"
          - LOW
          - MEDIUM
          - HIGH
          readOnly: true
    ServiceNowAttachment:
      allOf:
      - $ref: "#/components/schemas/VerificationAttachment"
      - type: object
        properties:
          ticketNumber:
            type: string
            description: ServiceNow ticket number.
            example: INC0012345
            minLength: 1
      description: A ServiceNow ticket attachment.
      required:
      - attachmentType
      - ticketNumber
    TicketNumberAttachment:
      allOf:
      - $ref: "#/components/schemas/VerificationAttachment"
      - type: object
