          type: string
          enum:
          - DMV
          - MNO_V
          - SCAN
        verifierResult:
          type: string
          enum:
          - SUCCESS
          - FAILURE
          - FATAL
          readOnly: true
        phoneNumberSuffix:
          type: string
        phoneNumberCountryCode:
          type: string
        matches:
          type: "null"
          $ref: "#/components/schemas/Matches"
          readOnly: true
        externalId:
          type:
          - string
          - "null"
      required:
      - documentNumberSuffix
      - documentType
      - lastName
    WorkspaceCallbackAttachment:
      allOf:
      - $ref: "#/components/schemas/VerificationAttachment"
      - type: object
        properties:
          urls:
            type: array
            items:
              type: string
              format: uri
            minItems: 1
            uniqueItems: true
      required:
      - attachmentType
      - urls
    CreateEncryptedVerificationDto:
      type: object
      properties:
        documentType:
          type: string
          enum:
          - US_CA_DL
          - UK_DL
          - PASSPORT
          - INDIA_DL
          - INDIA_ID
          - INDIA_PAN
          - PHILIPPINES_DL
          - PHILIPPINES_ID
          - PHILIPPINES_MULTI_ID
          - US_MILITARY_ID
          - US_VETERAN_ID
          - SINGAPORE_DL
          - SINGAPORE_ID
          - SINGAPORE_WORK_PERMIT
          - SINGAPORE_EMPLOYMENT_PASS
          - PAKISTAN_ID
          - AUSTRALIA_DL
          - MEXICO_DL
          - NETHERLANDS_DL
          - US_PERMANENT_RESIDENT_CARD
          - GERMANY_ID
          - GERMANY_DL
          - GERMANY_RESIDENCE_PERMIT
          - AUSTRIA_ID
          - AUSTRIA_DL
          - AUSTRIA_RESIDENCE_PERMIT
          example: US_CA_DL
        callbackUrl:
          type:
          - string
          - "null"
          format: uri
          example: https://example.com/callback/unique/to/this/request/8b62142a99ba759d8c9153b68765513c62180891
        requestedVerifiers:
          type: array
          description: Set of verifiers to run against this verification. Each entry
            uses the 'verifier' discriminator field.
          example:
          - verifier: DMV
          - verifier: MNO_V
            phoneNumber: "+12025551234"
          items:
            oneOf:
            - $ref: "#/components/schemas/RequestedVerifier"
            - $ref: "#/components/schemas/RequestedDmvVerifier"
            - $ref: "#/components/schemas/RequestedLexisNexisVerifier"
            - $ref: "#/components/schemas/RequestedMnoVerifier"
          uniqueItems: true
        subject:
          type: "null"
          $ref: "#/components/schemas/VerificationSubject"
          description: "Optional identity information about the subject of this verification,\
            \ used by the ExpectedSubjectVerifier to compare against the scanned document."
        requestedMessages:
          type: array
          description: Set of messages to send for this verification. Each entry uses
            the 'channel' discriminator field. Maximum 2.
          example:
          - channel: SMS
            phoneNumber: "+12025551234"
          - channel: EMAIL
            emailAddress: user@example.com
          items:
            oneOf:
            - $ref: "#/components/schemas/RequestedMessage"
            - $ref: "#/components/schemas/RequestedCopyMessage"
            - $ref: "#/components/schemas/RequestedEmailMessage"
            - $ref: "#/components/schemas/RequestedSmsMessage"
            - $ref: "#/components/schemas/RequestedTrustedSmsMessage"
          maxItems: 2
          minItems: 0
          uniqueItems: true
        status:
          type:
          - string
          - "null"
          enum:
          - CREATED
        publicWebKey:
          type: object
          additionalProperties: {}
          description: "Public key used for encrypting the verification response.\
            \ Must be one of RSA, EC or OKP (crv=X25519) type in JWK format."
      required:
      - documentType
    EncryptedVerificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: bd30618f-06d3-45c5-ae52-c36751fc20b2
          readOnly: true
        overallRisk:
          type: string
          enum:
          - "NO"
          - LOW
          - HIGH
          readOnly: true
        encryptedVerification:
          type: string
          description: JWE Verification object
          example: eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIn0...
          readOnly: true
    ScanResponse:
      type: object
      description: Parsed data from a scanned identity document.
      properties:
        documentNumber:
          type: string
          description: Driver license or ID card number.
          example: D12345678
        dateOfBirth:
          type: string
          description: Date of birth in MM/DD/YYYY format.
          example: 03/15/1990
        firstName:
          type: string
          description: First name as it appears on the document.
          example: JANE
        age:
          type: string
          description: Calculated age at time of scan.
          example: "36"
        lastName:
          type: string
          description: Last name as it appears on the document.
          example: SMITH
        middleName:
          type: string
          description: Middle name as it appears on the document.
          example: MARIE
        middleInitial:
          type: string
          description: Middle initial derived from the document.
          example: M
        issueDate:
          type: string
          description: Document issue date in MM/DD/YYYY format.
          example: 06/01/2020
        expiryDate:
          type: string
          description: Document expiration date in MM/DD/YYYY format.
          example: 03/15/2028
        documentType:
          type: string
          description: Human-readable type of the scanned document.
          example: Driver License
        sex:
          type: string
          description: Sex as it appears on the document.
          example: Female
        eyeColor:
          type: string
          description: Eye color as it appears on the document.
          example: Brown
        height:
          type: string
          description: Height in inches.
          example: "64"
        weight:
          type: string
          description: Weight in pounds.
          example: "130"
        address1:
          type: string
          description: Street address line 1.
          example: 123 MAIN ST
        address2:
          type: string
          description: Street address line 2.
          example: APT 4B
        city:
          type: string
          description: City name.
          example: LOS ANGELES
        state:
          type: string
          description: Two-letter state code.
          example: CA
        zipCode:
          type: string
          description: 5-digit ZIP code.
          example: "90001"
        zip4:
          type: string
          description: ZIP+4 extension.
          example: "1234"
        nationality:
          type: string
          description: Nationality from the document.
          example: UNITED STATES OF AMERICA
        iso3CountryCode:
          type: string
          description: ISO 3166-1 alpha-3 country code.
          example: USA
        iso2CountryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: US
        isoCountryName:
          type: string
          description: Full country name.
          example: United States of America
        issuingAuthority:
          type: string
          description: Authority that issued the document.
          example: DVLA
        placeOfBirth:
          type: string
          description: Place of birth from the document.
          example: ANGOLA
        verifiedMrz:
          type: boolean
          description: Whether the machine-readable zone (MRZ) was verified.
          example: false
        fullAddress:
          type: string
          description: "Concatenated full address derived from address1, address2,\
            \ city, state, and zipCode."
          example: "123 MAIN ST, LOS ANGELES, CA, 90001"
        suffix:
          type: string
          description: "Name suffix from the document (e.g. Jr, Sr)."
          example: JR
        documentCategory:
          type: string
          description: "Document category code (e.g. DL, PERMIT, ID)."
          example: DL
        documentJurisdiction:
          type: string
          description: Two-letter state code of the issuing jurisdiction.
          example: CA
        phoneNumber:
          type: string
          description: "Phone number from the document, if available."
        version:
          type: string
          description: Document scan version.
          enum:
          - Unknown
          - V0
          - V1
          - V2
    IdentityImage:
      type: object
      properties:
        data:
          type: string
          description: Base64-encoded image data of the scanned document.
        orientation:
          type: integer
          format: int32
          description: Rotation angle in degrees to display the image correctly.
          example: 0
    EncryptedDocumentResponse:
      type: object
      properties:
        verificationId:
          type: string
          format: uuid
          description: The verification ID associated with this document
          example: 10c9207a-1c3d-45fd-874f-a2af9c2d33d4
          readOnly: true
        encryptedDocument:
          type: string
          description: JWE document object
          example: eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIn0...
          readOnly: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
