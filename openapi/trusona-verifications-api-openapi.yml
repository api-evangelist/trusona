components:
  schemas:
    RequestedEmailMessage:
      allOf:
      - $ref: '#/components/schemas/RequestedMessage'
      - type: object
        properties:
          emailAddress:
            type: string
            format: email
            description: Email address to send the message to.
            example: user@example.com
            minLength: 1
      description: Send an email message to the provided email address.
      required:
      - channel
      - emailAddress
    VerificationHistory:
      type: object
      properties:
        verificationId:
          type: string
          format: uuid
        lastName:
          type: string
        channel:
          type: string
          enum:
          - COPY
          - SMS
          - EMAIL
          - TRUSTED_SMS
        documentNumberSuffix:
          type: string
        createdAt:
          type: string
          format: date-time
        overallRisk:
          type: string
          enum:
          - NONE
          - 'NO'
          - LOW
          - MEDIUM
          - HIGH
        maskedRecipient:
          type: string
        maskedLastName:
          type: string
        location:
          type: string
        recipient:
          type: string
    WorkspaceCallbackAttachment:
      allOf:
      - $ref: '#/components/schemas/VerificationAttachment'
      - type: object
        properties:
          urls:
            type: array
            items:
              type: string
              format: uri
            minItems: 1
            uniqueItems: true
      required:
      - attachmentType
      - urls
    RequestedCopyMessage:
      allOf:
      - $ref: '#/components/schemas/RequestedMessage'
      required:
      - channel
    VerificationDevice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: bd30618f-06d3-45c5-ae52-c36751fc20b2
          readOnly: true
        platform:
          type: string
          description: Required field
          example: MacIntel
          minLength: 1
          readOnly: true
        language:
          type: string
          minLength: 1
        browserTimeZone:
          type: string
          description: IANA timezone ID (e.g., America/New_York, Europe/London)
          example: America/Los_Angeles
          minLength: 1
          readOnly: true
        origin:
          type: string
          minLength: 1
        browserDateTime:
          type: string
          minLength: 1
        userAgent:
          type: string
        operatingSystem:
          type: string
        browser:
          type: string
        displayWidth:
          type: integer
          format: int32
        displayHeight:
          type: integer
          format: int32
        browserHeight:
          type: integer
          format: int32
        browserWidth:
          type: integer
          format: int32
        ipAddress:
          type: string
          example: 192.168.1.1
          readOnly: true
        ipAddressTimeZone:
          type: string
        country:
          type: string
        region:
          type: string
        city:
          type: string
        isp:
          type: string
        createdAt:
          type: string
          format: date-time
          example: 2022-01-01 00:00:00+00:00
          readOnly: true
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        gpsLatitude:
          type: number
          format: float
        gpsLongitude:
          type: number
          format: float
        via:
          type: array
          items:
            type: string
        offsetMinutes:
          type: integer
          format: int32
        epochMilliseconds:
          type: integer
          format: int64
        asn:
          type: string
        dateTime:
          type: string
        browserTimeZoneWithOffset:
          type: string
        scanCode:
          type: string
        linkCode:
          type: string
        scannedDocument:
          type: boolean
        blacklistedNetwork:
          type: boolean
        whitelistedNetwork:
          type: boolean
        truPassUsed:
          type: boolean
        fingerprint:
          type: string
      required:
      - browserDateTime
      - browserTimeZone
      - epochMilliseconds
      - language
      - offsetMinutes
      - origin
      - platform
    RequestedVerifier:
      type: object
      discriminator:
        propertyName: verifier
      properties:
        verifier:
          type: string
          enum:
          - DMV
          - MNO_V
          - SCAN
      required:
      - verifier
    RequestedSmsMessage:
      allOf:
      - $ref: '#/components/schemas/RequestedMessage'
      - type: object
        properties:
          phoneNumber:
            type: string
            description: Phone number to send the SMS to. Dashes, spaces, dots and parentheses are accepted, as is a missing leading +; the number is stored and returned in E.164 form. A number sent without a country code cannot be resolved and is rejected.
            example: '+12025551234'
      description: Send an SMS message to the provided phone number.
      required:
      - channel
    RequestedLexisNexisVerifier:
      allOf:
      - $ref: '#/components/schemas/RequestedVerifier'
      description: Request a LexisNexis verification.
      required:
      - verifier
    TicketNumberAttachment:
      allOf:
      - $ref: '#/components/schemas/VerificationAttachment'
      - type: object
        properties:
          ticketNumber:
            type: string
            description: Ticket number from an external ticketing system.
            example: TKT-98765
            minLength: 1
      description: A generic ticket number attachment.
      required:
      - attachmentType
      - ticketNumber
    RequestedMessage:
      type: object
      discriminator:
        propertyName: channel
      properties:
        channel:
          type: string
          enum:
          - COPY
          - SMS
          - EMAIL
          - TRUSTED_SMS
      required:
      - channel
    RequestedTrustedSmsMessage:
      allOf:
      - $ref: '#/components/schemas/RequestedMessage'
      - type: object
        properties:
          phoneNumber:
            type: string
            description: Phone number to send the trusted SMS to. Dashes, spaces, dots and parentheses are accepted, as is a missing leading +; the number is stored and returned in E.164 form. A number sent without a country code cannot be resolved and is rejected.
            example: '+12025551234'
      description: Send a trusted SMS with SIM swap detection to the provided phone number.
      required:
      - channel
    RequestedMnoVerifier:
      allOf:
      - $ref: '#/components/schemas/RequestedVerifier'
      - type: object
        properties:
          phoneNumber:
            type: string
            description: Phone number for MNO verification. Must be in one of the countries the tenant has enabled for MNO, which default to the USA (+1), Canada (+1) and the UK (+44). Dashes, spaces, dots and parentheses are accepted; a missing country code is resolved against the default countries, so numbers from any other enabled country must be given in E.164 form.
            example: '+12025551234'
      description: Request an MNO (mobile network operator) verification.
      required:
      - verifier
    VerificationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: bd30618f-06d3-45c5-ae52-c36751fc20b2
          readOnly: true
        lastName:
          type: string
          minLength: 1
          readOnly: true
        phoneNumber:
          type:
          - string
          - 'null'
        documentType:
          type: string
          enum:
          - US_CA_DL
