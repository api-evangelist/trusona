      - documentNumberSuffix
      - documentType
      - lastName
    VerificationSubject:
      type: object
      description: Subject identity information supplied by the API consumer for matching against the scanned document.
      properties:
        firstName:
          type: string
          description: Expected first name.
          example: Susan
          maxLength: 128
          minLength: 0
        lastName:
          type: string
          description: Expected last name.
          example: O'Brien
          maxLength: 128
          minLength: 0
        dateOfBirth:
          type: string
          description: Expected date of birth in MM/DD/YYYY format.
          example: 03/14/1990
        city:
          type: string
          description: Expected city.
          example: San Francisco
          maxLength: 32
          minLength: 0
        state:
          type: string
          description: Expected state, province or region.
          example: CA
          maxLength: 32
          minLength: 0
        country:
          type: string
          description: Expected country as ISO 3166-1 alpha-2.
          example: US
          pattern: ^[A-Za-z]{2}$
    VerificationMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
          example: 2022-01-01 00:00:00+00:00
          readOnly: true
        channel:
          type: string
          enum:
          - COPY
          - SMS
          - EMAIL
          - TRUSTED_SMS
        recipient:
          type: string
        simSwapped:
          type: boolean
    VerificationAttachment:
      type: object
      discriminator:
        propertyName: attachmentType
      properties:
        attachmentType:
          type: string
          enum:
          - SERVICENOW
          - WORKSPACE_CALLBACKS
          - GENERIC_TICKET
      required:
      - attachmentType
    VerificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agentEmailAddress:
          type: string
          format: email
          description: Email address of the agent or service account that created the verification. Server-derived from the authenticated principal; values supplied by clients are ignored.
          example: agent@example.com
          readOnly: true
        documentType:
          type: string
          enum:
          - US_CA_DL
          - UK_DL
          - PASSPORT
          - INDIA_DL
          - INDIA_ID
          - INDIA_PAN
          - PHILIPPINES_DL
          - PHILIPPINES_ID
          - PHILIPPINES_MULTI_ID
          - US_MILITARY_ID
          - US_VETERAN_ID
          - SINGAPORE_DL
          - SINGAPORE_ID
          - SINGAPORE_WORK_PERMIT
          - SINGAPORE_EMPLOYMENT_PASS
          - PAKISTAN_ID
          - AUSTRALIA_DL
          - MEXICO_DL
          - NETHERLANDS_DL
          - US_PERMANENT_RESIDENT_CARD
          - GERMANY_ID
          - GERMANY_DL
          - GERMANY_RESIDENCE_PERMIT
          - AUSTRIA_ID
          - AUSTRIA_DL
          - AUSTRIA_RESIDENCE_PERMIT
          example: US_CA_DL
        linkUrl:
          type: string
          format: uri
        callbackUrl:
          type:
          - string
          - 'null'
          format: uri
          example: https://example.com/callback/unique/to/this/request/8b62142a99ba759d8c9153b68765513c62180891
        linkUrlExpiresAt:
          type: string
          format: date-time
        reviewAccessExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        requestedVerifiers:
          type: array
          description: Set of verifiers to run against this verification. Each entry uses the 'verifier' discriminator field.
          example:
          - verifier: DMV
          - verifier: MNO_V
            phoneNumber: '+12025551234'
          items:
            oneOf:
            - $ref: '#/components/schemas/RequestedVerifier'
            - $ref: '#/components/schemas/RequestedDmvVerifier'
            - $ref: '#/components/schemas/RequestedLexisNexisVerifier'
            - $ref: '#/components/schemas/RequestedMnoVerifier'
          readOnly: true
          uniqueItems: true
        requestedMessages:
          type: array
          description: Set of messages to send for this verification. Each entry uses the 'channel' discriminator field. Maximum 2.
          example:
          - channel: SMS
            phoneNumber: '+12025551234'
          - channel: EMAIL
            emailAddress: user@example.com
          items:
            oneOf:
            - $ref: '#/components/schemas/RequestedMessage'
            - $ref: '#/components/schemas/RequestedCopyMessage'
            - $ref: '#/components/schemas/RequestedEmailMessage'
            - $ref: '#/components/schemas/RequestedSmsMessage'
            - $ref: '#/components/schemas/RequestedTrustedSmsMessage'
          maxItems: 2
          minItems: 0
          uniqueItems: true
        status:
          type: string
          enum:
          - WAITING
          - SCANNED
          - EXPIRED
        closed:
          type: boolean
        expiredReviewAccess:
          type: boolean
        expiredLinkUrlAccess:
          type: boolean
        overallRisk:
          type: string
          enum:
          - 'NO'
          - LOW
          - HIGH
          readOnly: true
        workspaceLink:
          type: string
          format: uri
        supportedVerifiers:
          type: array
          enum:
          - DMV
          - MNO_V
          - SCAN
          items:
            type: string
            enum:
            - DMV
            - NONE
            - MNO_V
            - SCAN
            - LEXIS
            - PASSKEY
            - ESV
          readOnly: true
          uniqueItems: true
        attachments:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/VerificationAttachment'
            - $ref: '#/components/schemas/ServiceNowAttachment'
            - $ref: '#/components/schemas/TicketNumberAttachment'
            - $ref: '#/components/schemas/WorkspaceCallbackAttachment'
        verifierChecks:
          type: array
          items:
            $ref: '#/components/schemas/VerificationSummary'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/VerificationMessage'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/VerificationDevice'
        riskScores:
          type: array
          items:
            $ref: '#/components/schemas/RiskScore'
        billable:
          type: boolean
          readOnly: true
        billableAt:
          type: string
          format: date-time
          readOnly: true
        subject:
          $ref: '#/components/schemas/VerificationSubject'
          description: Optional identity information about the subject of this verification, used by the ExpectedSubjectVerifier to compare against the scanned document.
        history:
          type: array
          items:
            $ref: '#/components/schemas/VerificationHistory'
      required:
      - documentType
    ServiceNowAttachment:
      allOf:
      - $ref: '#/components/schemas/VerificationAttachment'
