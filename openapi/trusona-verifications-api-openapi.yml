          - PASSPORT
          - INDIA_DL
          - INDIA_ID
          - INDIA_PAN
          - PHILIPPINES_DL
          - PHILIPPINES_ID
          - PHILIPPINES_MULTI_ID
          - US_MILITARY_ID
          - US_VETERAN_ID
          - SINGAPORE_DL
          - SINGAPORE_ID
          - SINGAPORE_WORK_PERMIT
          - SINGAPORE_EMPLOYMENT_PASS
          - PAKISTAN_ID
          - AUSTRALIA_DL
          - MEXICO_DL
          - NETHERLANDS_DL
          - US_PERMANENT_RESIDENT_CARD
          - GERMANY_ID
          - GERMANY_DL
          - GERMANY_RESIDENCE_PERMIT
          - AUSTRIA_ID
          - AUSTRIA_DL
          - AUSTRIA_RESIDENCE_PERMIT
        documentNumberSuffix:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
          example: 2022-01-01 00:00:00+00:00
          readOnly: true
        verifier:
          type: string
          enum:
