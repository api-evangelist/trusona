- target: $.paths['/api/v1/verifications'].get
  update:
    x-agent-note: '`since` is REQUIRED. Omitting it returns 400. Walk forward by passing
      the last result''s timestamp or id as the next `since`; there is no cursor.'
- target: $.paths['/api/v1/verifications'].post
  update:
    x-agent-note: 'Do not send `requestedVerifiers` — Trusona documents it as being
      deprecated and decided server-side. Verifier outcomes still return via
      verifierChecks[]. `subject.dateOfBirth` is MM/DD/YYYY on this API.'
    x-reversibility:
      reversal: none
      note: No cancel or void operation exists; the verification ends only by expiry.
- target: $.paths['/api/v1/verifications/{verificationId}'].get
  update:
    x-agent-note: 'status is WAITING | SCANNED | EXPIRED ONLY — there is no SUCCESS or
      FAILURE. Read the outcome from overallRisk, verifierChecks[] and riskScores[].'
- target: $.paths['/api/v1/verifications/{verificationId}/messages'].post
  update:
    x-agent-note: '422 means a SIM swap was detected on a TRUSTED_SMS — a security
      finding, not a client bug; do not retry over SMS. 410 means the verification is
      closed to new messages. 429 is a tenant quota with no Retry-After header.'
- target: $.paths['/api/v1/verifications/{verificationId}/document'].get
  update:
    x-agent-note: 'Returns BOTH masked and unmasked PII in one response. Default to the
      masked variant. 410 Gone is terminal — the document is removed when the parent
      verification expires and the retention window is not published.'
    x-pii: high
