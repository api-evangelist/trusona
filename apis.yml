aid: trusona
name: Trusona
description: Trusona is a Scottsdale, Arizona identity impersonation detection company founded in 2015
  by fraud-prevention expert Ori Eisen, funded by Kleiner Perkins and advised by Frank Abagnale. Its ATO
  Protect suite verifies that the person behind a help-desk call, account-recovery request, MFA reset,
  HR onboarding or wire approval is really who they claim to be — checking a government-issued ID against
  authoritative sources such as State DMVs over the AAMVA network and layering SIM-swap/port-out detection,
  patented man-in-the-middle detection (US Patent 10,601,859) and anti-replay technology, deliberately
  without a liveness selfie. Trusona publishes two OpenAPI 3.1 contracts at authcloud.trusona.net — the
  Verification API (v2.2.0) and the Driver License Verification API (v1.0.0) — a legacy AAMVA ID Proofing
  v2 REST surface, an Apache-2.0 Claude Agent Skill, an llms.txt, and server/mobile SDKs for Java, Ruby,
  JavaScript, .NET, C, iOS and Android.
