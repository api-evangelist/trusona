apis:
- name: Trusona ATO Protect Verification API
  description: 'REST API to create and read identity verifications: send a hosted scan link by SMS or
    email, read overall risk, per-verifier checks, risk scores, scanned documents and the devices seen
    during the verification. Also offers an encrypted variant where responses are returned under a caller-supplied
    JWK. Bearer JWT auth.'
  humanURL: https://authcloud.trusona.net/docs/index.html
  baseURL: https://authcloud.trusona.net
  tags:
  - Identity Verification
  - Account Takeover
  - Risk Scoring
  properties:
  - type: OpenAPI
    url: openapi/trusona-verification-api-openapi.yml
  - type: APIReference
    url: https://authcloud.trusona.net/docs/index.html
  - type: Overlay
    url: overlays/trusona-verification-api-overlay.yaml
- name: Trusona Driver License Verification API (IDV API)
  description: REST API that submits supplied identity data for asynchronous driver-license verification
    against State DMV records over AAMVA and against mobile network operator (MNO) records, returning
    per-field match results to a callback URL or on poll. Bearer JWT auth.
  humanURL: https://authcloud.trusona.net/docs/id-verifications/index.html
  baseURL: https://authcloud.trusona.net
  tags:
  - Identity Verification
  - Driver License
  - AAMVA
  properties:
  - type: OpenAPI
    url: openapi/trusona-driver-license-verification-api-openapi.yml
  - type: APIReference
    url: https://authcloud.trusona.net/docs/id-verifications/index.html
  - type: Overlay
    url: overlays/trusona-driver-license-verification-api-overlay.yaml
- name: Trusona ID Proofing API (v2)
  description: 'Legacy AAMVA identity-document proofing REST surface documented on the Trusona site rather
    than as an OpenAPI: barcode verifications, verifications, a verification lookup by transaction locator
    id, a supported-states list and a status endpoint. API-key auth. The production host is provisioned
    per tenant under an evaluation agreement; the only host Trusona publishes is the sandbox.'
  humanURL: https://www.trusona.com/integrations/trusona-id-proofing-integration-guide
  baseURL: https://idproof-cert.trusona.net
  x-base-url-note: baseURL is the SANDBOX host Trusona publishes verbatim in its ID Proofing sandbox guide
    (https://idproof-cert.trusona.net/api/v2/verifications). The integration guide states production access
    is supplied by Trusona when an evaluation agreement is signed and never names a production host, so
    none is recorded here rather than guessed.
  tags:
  - Identity Verification
  - AAMVA
  - Document Verification
  properties:
  - type: Documentation
    url: https://www.trusona.com/integrations/trusona-id-proofing-integration-guide
  - type: Sandbox
    url: https://www.trusona.com/integrations/trusona-id-proofing-sandbox-environment-guide
