apis:
- name: Trusona ID Proofing API (v2)
  description: >-
    Legacy AAMVA identity-document proofing REST surface documented on the Trusona site rather than as
    an OpenAPI: barcode verifications, verifications, a verification lookup by transaction locator id,
    a supported-states list and a status endpoint. API-key auth. The production host is provisioned per
    tenant under an evaluation agreement; the only host Trusona publishes is the sandbox.
  humanURL: https://www.trusona.com/integrations/trusona-id-proofing-integration-guide
  baseURL: https://idproof-cert.trusona.net
  x-base-url-note: >-
    baseURL is the SANDBOX host Trusona publishes verbatim in its ID Proofing sandbox guide (https://idproof-cert.trusona.net/api/v2/verifications).
    The integration guide states production access is supplied by Trusona when an evaluation agreement
    is signed and never names a production host, so none is recorded here rather than guessed.
  tags:
  - Identity Verification
  - AAMVA
  - Document Verification
