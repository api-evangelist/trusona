domain_standards:
- id: aamva-dl-id-card-design-standard
  name: AAMVA (American Association of Motor Vehicle Administrators) driver license /
    identification verification
  conforms: true
  market: identity verification / document proofing
  evidence: 'This is Trusona''s domain standard and it is declared IN THE CONTRACT, not
    only in marketing. The Driver License Verification API''s components.schemas contains
    `DmvIdVerifier` and `MnoIdVerifier` under an `IdVerifiers` object, and
    createIdVerification is documented as verification "against DMV and MNO databases",
    returning per-source PENDING | SUCCESS | FAILURE | FATAL results on `dmv` and `mno`.
    The ID Proofing v2 surface goes further: POST /api/v2/barcode_verifications takes an
    `aamva` object carrying `barcode_data` — the PDF417 barcode payload defined by the
    AAMVA DL/ID Card Design Standard — and GET /api/v2/supported_states enumerates the
    states participating in the AAMVA verification program. A relying party that already
    parses AAMVA barcodes integrates with no bespoke mapping.'
  spec_locations:
  - openapi/trusona-driver-license-verification-api-openapi.yml#/components/schemas/DmvIdVerifier
  - openapi/trusona-driver-license-verification-api-openapi.yml#/components/schemas/MnoIdVerifier
  - openapi/trusona-driver-license-verification-api-openapi.yml#/components/schemas/IdVerifiers
  - 'ID Proofing v2: POST /api/v2/barcode_verifications (aamva.barcode_data),
    GET /api/v2/supported_states'
  docs: https://www.trusona.com/premium-idv
- id: mno-sim-swap-detection
  name: Mobile network operator SIM-swap / port-out signal
  conforms: true
  market: identity verification / telecom risk signals
  evidence: 'The Verification API surfaces the MNO signal as a first-class contract
